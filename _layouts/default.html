<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
    {% seo %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header class="site-header" role="banner" aria-label="Site header">
      <div class="container header-inner">
        <div class="brand-lockup">
          <a class="site-mark" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">CT</a>
          <div>
            <p class="site-kicker">A field guide to everyday communication</p>
            <p class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></p>
          </div>
        </div>
        <nav class="site-nav" role="navigation" aria-label="Primary">
          <ul class="nav-list">
            <li><a{% if page.url == '/' %} class="is-current"{% endif %} href="{{ '/' | relative_url }}">Home</a></li>
            <li><a{% if page.url contains 'transmission-view' %} class="is-current"{% endif %} href="{{ '/pages/transmission-view.html' | relative_url }}">Transmission</a></li>
            <li><a{% if page.url contains 'meaning-and-culture' %} class="is-current"{% endif %} href="{{ '/pages/meaning-and-culture.html' | relative_url }}">Meaning &amp; culture</a></li>
            <li><a{% if page.url contains 'interpretation-and-power' %} class="is-current"{% endif %} href="{{ '/pages/interpretation-and-power.html' | relative_url }}">Power</a></li>
            <li><a{% if page.url contains 'interpretation-and-intention' %} class="is-current"{% endif %} href="{{ '/pages/interpretation-and-intention.html' | relative_url }}">Intention</a></li>
            <li><a{% if page.url contains 'reader-guidance' %} class="is-current"{% endif %} href="{{ '/pages/reader-guidance.html' | relative_url }}">What to do</a></li>
            <li><a{% if page.url contains 'how-i-built-this-site' %} class="is-current"{% endif %} href="{{ '/pages/how-i-built-this-site.html' | relative_url }}">About</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="main-content" class="container page-shell{% if page.url == '/' %} home-shell{% endif %}" role="main" aria-label="Main content">
      {{ content }}
    </main>

    <footer class="site-footer" role="contentinfo" aria-label="Site footer">
      <div class="container">
        <p><span class="footer-mark">CT</span> {{ site.title }} <span class="footer-separator">/</span> Built for clearer conversations.</p>
      </div>
    </footer>
  </body>
</html>
