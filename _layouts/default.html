<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
    {% seo %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header class="site-header" role="banner" aria-label="Site header">
      <div class="container">
        <h1 class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
        <p class="site-tagline">{{ site.description }}</p>
        <nav role="navigation" aria-label="Primary">
          <ul class="nav-list">
            <li><a href="{{ '/' | relative_url }}">Home</a></li>
            <li><a href="{{ '/pages/transmission-view.html' | relative_url }}">Transmission View</a></li>
            <li><a href="{{ '/pages/meaning-and-culture.html' | relative_url }}">Meaning &amp; Culture</a></li>
            <li><a href="{{ '/pages/interpretation-and-power.html' | relative_url }}">Interpretation &amp; Power</a></li>
            <li><a href="{{ '/pages/interpretation-and-intention.html' | relative_url }}">Interpretation &amp; Intention</a></li>
            <li><a href="{{ '/pages/reader-guidance.html' | relative_url }}">What to Do</a></li>
            <li><a href="{{ '/pages/how-i-built-this-site.html' | relative_url }}">How I Built This Site</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="main-content" class="container" role="main" aria-label="Main content">
      {{ content }}
    </main>

    <footer class="site-footer" role="contentinfo" aria-label="Site footer">
      <div class="container">
        <p>&copy; {{ "now" | date: "%Y" }} {{ site.title }}.</p>
      </div>
    </footer>
  </body>
</html>
